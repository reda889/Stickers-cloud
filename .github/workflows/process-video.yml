name: Process Videos with FFmpeg

on:
  push:
    paths:
      - 'input/**'
    branches:
      - main

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Process new videos to MP4
        run: |
          mkdir -p output
          for file in input/*; do
            if [ -f "$file" ]; then
              filename=$(basename -- "$file")
              base="${filename%.*}"
              out="output/${base}.mp4"
              if [ ! -f "$out" ]; then
                echo "Processing: $filename"
                ffmpeg -i "$file" -an -c:v libx264 -preset slow -crf 23 -movflags +faststart -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" "$out" && echo "Done: $out"
              else
                echo "Skip (exists): $out"
              fi
            fi
          done

      - name: Commit and push processed files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-process videos [skip ci]"
            git push
          else
            echo "Nothing new to commit."
          fi